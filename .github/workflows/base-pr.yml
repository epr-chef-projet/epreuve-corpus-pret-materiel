name: Vérifications des contributions

on:
    pull_request:
        branches: [main, qualification/p-epr-c-07]
        types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
    contents: read
    actions: read

concurrency:
    group: base-pr-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && '-metadata' || '' }}
    cancel-in-progress: true

jobs:
    validation:
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null || (github.event.changes.title == null && github.event.changes.body == null) }}
        uses: ./.github/workflows/base-common.yml

    base-pr:
        name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'pr-metadata' || 'base-pr' }}
        needs: validation
        if: ${{ always() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 3
        env:
            TEXT_ONLY: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) }}
        steps:
            - name: Constater une modification du texte seulement
              if: ${{ env.TEXT_ONLY == 'true' }}
              env:
                  RESULT: ${{ needs.validation.result }}
              run: test "$RESULT" = skipped

            - name: Exiger les preuves de cette proposition
              if: ${{ env.TEXT_ONLY != 'true' }}
              env:
                  RESULT: ${{ needs.validation.result }}
                  VALIDATED: ${{ needs.validation.outputs.validated }}
                  ACTUAL_SHA: ${{ needs.validation.outputs.sha }}
                  ACTUAL_RUN: ${{ needs.validation.outputs.run }}
                  ACTUAL_ATTEMPT: ${{ needs.validation.outputs.attempt }}
                  JOB_STATUS: ${{ job.status }}
              run: |
                  test "$JOB_STATUS" = success
                  test "$RESULT" = success
                  test "$VALIDATED" = true
                  test "$ACTUAL_SHA" = "$GITHUB_SHA"
                  test "$ACTUAL_RUN" = "$GITHUB_RUN_ID"
                  test "$ACTUAL_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
